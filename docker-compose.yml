services:
  mcp-auth:
    build: ./logging-proxy
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth
      UPSTREAM: http://mcp-auth-app:9000
    volumes:
      - /opt/mcp/logs:/logs
    depends_on:
      - mcp-auth-app
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.mcp-auth.forwardauth.address: http://mcp-auth:8080/verify
      traefik.http.middlewares.mcp-auth.forwardauth.authResponseHeaders: X-Auth-User
      traefik.http.services.mcp-auth.loadbalancer.server.port: 8080   # silences "port is missing"

  mcp-auth-app:
    build: ./auth
    restart: unless-stopped
    volumes:
      - /opt/mcp/tokens.json:/tokens/tokens.json:ro
    networks:
      - dokploy-network

  google-ads-mcp:
    build: ./gads   # pinned commit + lockfile; see gads/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - /opt/mcp/adc.json:/secrets/adc.json:ro
    networks:
      - dokploy-network

  gads:
    build: ./logging-proxy
    restart: unless-stopped
    environment:
      SERVICE_NAME: gads
      UPSTREAM: http://google-ads-mcp:8080
    volumes:
      - /opt/mcp/logs:/logs
    depends_on:
      - google-ads-mcp
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gads.rule: Host(`gads.mcp.trioflow.io`)
      traefik.http.routers.gads.entrypoints: websecure
      traefik.http.routers.gads.tls.certresolver: letsencrypt
      traefik.http.routers.gads.middlewares: mcp-auth@docker
      traefik.http.routers.gads.service: gads                          # ← pin router to OUR service
      traefik.http.services.gads.loadbalancer.server.port: 8080

  ga4-mcp:
    build: ./ga4
    restart: unless-stopped
    env_file: .env
    environment:
      # GA4 uses a service account; Ads still uses the bot-user ADC.
      # environment: overrides env_file for this service only.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ga4-sa.json
    volumes:
      - /opt/mcp/ga4-sa.json:/secrets/ga4-sa.json:ro
    networks:
      - dokploy-network

  ga4:
    build: ./logging-proxy
    restart: unless-stopped
    environment:
      SERVICE_NAME: ga4
      UPSTREAM: http://ga4-mcp:8080
    volumes:
      - /opt/mcp/logs:/logs
    depends_on:
      - ga4-mcp
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.ga4.rule: Host(`ga4.mcp.trioflow.io`)
      traefik.http.routers.ga4.entrypoints: websecure
      traefik.http.routers.ga4.tls.certresolver: letsencrypt
      traefik.http.routers.ga4.middlewares: mcp-auth@docker
      traefik.http.routers.ga4.service: ga4                            # ← pin router to OUR service
      traefik.http.services.ga4.loadbalancer.server.port: 8080

  gsc-mcp:
    build: ./gsc    # pinned commit + lockfile; see gsc/Dockerfile
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
      GSC_CREDENTIALS_PATH: /secrets/gsc-sa.json
      GSC_SKIP_OAUTH: "true"
    volumes:
      - /opt/mcp/gsc-sa.json:/secrets/gsc-sa.json:ro
    networks:
      - dokploy-network

  gsc:
    build: ./logging-proxy
    restart: unless-stopped
    environment:
      SERVICE_NAME: gsc
      UPSTREAM: http://gsc-mcp:8080
    volumes:
      - /opt/mcp/logs:/logs
    depends_on:
      - gsc-mcp
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gsc.rule: Host(`gsc.mcp.trioflow.io`)
      traefik.http.routers.gsc.entrypoints: websecure
      traefik.http.routers.gsc.tls.certresolver: letsencrypt
      traefik.http.routers.gsc.middlewares: mcp-auth@docker
      traefik.http.routers.gsc.service: gsc
      traefik.http.services.gsc.loadbalancer.server.port: 8080

networks:
  dokploy-network:
    external: true